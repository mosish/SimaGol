<body>
  <a class="skip" href="#month" data-label="skip"></a>
  <header><div class="header-wrap">
    <a class="brand" href="/"><span class="seal" aria-hidden="true">✿</span><span><strong data-label="brand"></strong><small lang="en">SIMAGOL</small></span></a>

    <div class="utilities"><a class="header-cart" href="/#bag" aria-label="سبد خرید"></a><span class="appearance-controls"></span></div>
  </div></header>
  <main>
    <h1 class="planner-title" data-label="title"></h1>
    <nav class="planner-views" aria-label="تقویم و یادآوری"><a href="#calendar" data-label="calendarView"></a><a href="#occasions" data-label="myDates"></a><a href="#reminders" data-label="reminders"></a></nav>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="planner-layout" data-view="calendar">
      <section class="sheet calendar" id="month" tabindex="-1" aria-labelledby="month-title">
        <div class="calendar-toolbar">
          <h2 id="month-title" class="calendar-sr" aria-live="polite"></h2>
          <div class="calendar-jump"><select id="jump-month" aria-label="ماه"></select><select id="jump-year" aria-label="سال"></select></div>
          <fieldset id="calendar-system" aria-label="نوع تقویم"><label><input type="radio" name="system" value="persian"><span data-label="solar"></span></label><label><input type="radio" name="system" value="gregory"><span data-label="gregorian"></span></label></fieldset>
          <div class="month-actions"><button id="previous"></button><button id="today" data-label="today"></button><button id="next"></button></div>
        </div>
        <div id="weekdays" aria-hidden="true" class="weekdays"></div><div id="days" class="days"></div>
      </section>
      <section class="sheet day-summary" aria-labelledby="selected-title"><h2 id="selected-title"></h2><div id="selected"></div></section>
      <details class="sheet regional-list"><summary data-label="regionalList"></summary><p id="coverage" class="hint"></p><div id="regional"></div></details>
    </div>
        <section class="sheet" id="saved" data-view="occasions" hidden><div class="section-top"><h2 data-label="myDates"></h2></div><div id="entries"></div><button id="legacy" hidden data-label="legacy"></button></section>
        <section class="sheet" data-view="reminders" hidden><div class="section-top"><h2 data-label="reminders"></h2><span id="unread" role="status" aria-live="polite"></span></div><div id="inbox"></div></section>

    <section class="sheet preferences" data-view="reminders" hidden aria-labelledby="pref-heading">
      <h2 id="pref-heading" data-label="settings"></h2>
      <form id="prefs"><label><span data-label="localTime"></span><input id="time" type="time" required></label><label><span data-label="zone"></span><input id="zone" type="text" required placeholder="Asia/Tehran" dir="ltr"></label><label><input type="checkbox" id="follow-zone"><span data-label="followZone"></span></label><button class="minor" data-label="saveSettings"></button></form>
      <section id="sms-settings" hidden><h3 data-label="smsTitle"></h3><p id="verified"></p><p id="sms-help" class="hint" data-label="smsSetup"></p><form id="sms-phone"><label><span data-label="mobile"></span><input name="phone" dir="ltr" type="tel" required></label><button data-label="sendCode"></button></form><form id="sms-code" hidden><label><span data-label="code"></span><input name="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label><button data-label="verify"></button></form></section>
      <p class="hint" data-label="deviceHelp"></p><div class="actions"><button id="install-app" class="minor" data-label="install"></button><button id="enable-push" class="minor" data-label="enable"></button><button id="disable-push" class="minor" data-label="disable"></button></div>
    </section>
  </main>
  <nav class="app-tabs"></nav>
  <dialog id="day-sheet" aria-labelledby="sheet-title"><div class="section-top"><h2 id="sheet-title"></h2><button type="button" class="minor" id="close-day" data-label="close"></button></div><div id="sheet-events"></div></dialog>
  <dialog id="editor"><form id="event-form">
    <div class="section-top"><h2 id="form-title"></h2><button type="button" id="cancel" class="minor" data-label="close"></button></div>
    <label><span data-label="kind"></span><select name="type"><option value="birthday" data-label="birthday"></option><option value="anniversary" data-label="anniversary"></option><option value="custom" data-label="custom"></option><option value="occasion" data-label="flowerOccasion"></option></select></label>
    <label><span data-label="name"></span><input name="name" required maxlength="120" autocomplete="off"></label>
    <label><span data-label="date"></span><input name="date" type="text" dir="ltr" required maxlength="10" placeholder="1405/01/01"></label>
    <label><input type="checkbox" name="annual"><span data-label="annual"></span></label>
    <label><span data-label="recipient"></span><input name="recipient" maxlength="140"></label>
    <label><span data-label="lead"></span><input name="daysBefore" type="number" min="0" max="365" step="1" required></label>
    <p id="holiday-lead" class="hint" hidden data-label="holidayLead"></p>
    <label id="sms-option" hidden><input type="checkbox" name="sms"><span data-label="smsOption"></span></label>
    <label><span data-label="notes"></span><textarea name="notes" maxlength="1000"></textarea></label>
    <label><span data-label="link"></span><input name="link" type="url" maxlength="2048" placeholder="https://" dir="ltr"></label>
    <p id="form-error" role="alert"></p><button class="cta" type="submit" data-label="save"></button>
  </form></dialog>
  <dialog id="confirm"><h2 data-label="deleteTitle"></h2><p id="delete-name"></p><div class="actions"><button class="minor" id="keep" data-label="cancel"></button><button class="cta" id="remove" data-label="delete"></button></div></dialog>
  <noscript>برای استفاده از تقویم جاوااسکریپت را فعال کنید. Enable JavaScript to use the calendar.</noscript>
</body>
</html>
