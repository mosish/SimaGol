name: SimaGol verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: node --experimental-test-coverage --test tests/*.test.js
      - name: Install isolated CI tools
        run: npm install --no-save --package-lock=false playwright@1.56.1 eslint@9.39.1
      - run: npx --no-install eslint .
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tests/browser.smoke.mjs
      - run: docker build -t simagol-ci .
      - name: Start release container and verify health
        run: |
          docker run -d --name shop -p 127.0.0.1:3090:3000 -e APP_ORIGIN=https://shop.example simagol-ci
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:3090/api/health
